name: Build and test

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    inputs:
      ref:
        type: string
        required: true

permissions:
  contents: read

jobs:
  scope:
    name: Select component checks
    runs-on: ubuntu-latest
    outputs:
      core: ${{ steps.select.outputs.core }}
      java: ${{ steps.select.outputs.java }}
      kotlin: ${{ steps.select.outputs.kotlin }}
      package: ${{ steps.select.outputs.package }}
      pilot: ${{ steps.select.outputs.pilot }}
      workflow: ${{ steps.select.outputs.workflow }}
      shards: ${{ steps.select.outputs.shards }}
      total: ${{ steps.select.outputs.total }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - id: select
        env:
          CHECK_REF: ${{ inputs.ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node .github/ci/select-tests.ts
  workflow:
    name: Workflow policy / ${{ matrix.os }}
    needs: scope
    if: needs.scope.outputs.workflow == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install the locked dependencies
        run: |
          npm install --global npm@11.20.0 --ignore-scripts
          npm ci
      - name: Check workflow behavior
        run: npx vitest run --config vitest.ci.config.ts
  check:
    needs: scope
    if: needs.scope.outputs.core != '[]'
    name: Node 24 / ${{ matrix.os }} / ${{ matrix.shard }} of ${{ needs.scope.outputs.total }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        shard: ${{ fromJSON(needs.scope.outputs.shards) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Use the pinned package manager
        run: npm install --global npm@11.20.0 --ignore-scripts
      - name: Install the locked dependencies
        run: npm ci
      - name: Regenerate the grammar
        run: npm run grammar:generate
      - name: Build the native Java and Kotlin resources
        run: npm run java:build && npm run kotlin:build
      - name: Check all source and test types
        run: npm run typecheck
      - name: Build and test the shard
        run: npm test -- --config vitest.core.config.ts ${{ join(fromJSON(needs.scope.outputs.core), ' ') }} --shard=${{ matrix.shard }}/${{ needs.scope.outputs.total }} --maxWorkers=2 --reporter=default --reporter=json --outputFile=.local-docs/test-results.json
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        if: always()
        with:
          name: core-${{ matrix.os }}-${{ matrix.shard }}
          path: .local-docs/test-results.json
          include-hidden-files: true
          if-no-files-found: error
  project-pilot:
    needs: scope
    if: needs.scope.outputs.pilot == 'true'
    name: Project pilot / ${{ matrix.os }} / ${{ matrix.shard }} of ${{ matrix.total }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, shard: 1, total: 2 }
          - { os: ubuntu-latest, shard: 2, total: 2 }
          - { os: windows-latest, shard: 1, total: 4 }
          - { os: windows-latest, shard: 2, total: 4 }
          - { os: windows-latest, shard: 3, total: 4 }
          - { os: windows-latest, shard: 4, total: 4 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Use the pinned package manager
        run: npm install --global npm@11.20.0 --ignore-scripts
      - name: Install the locked dependencies
        run: npm ci
      - name: Verify installed project journeys
        env:
          EXPEC_CLEANUP_TIMINGS: '1'
        run: npm run test:pilot -- --shard=${{ matrix.shard }}/${{ matrix.total }} --reporter=default --reporter=json --outputFile=.local-docs/test-results.json
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        if: always()
        with:
          name: pilot-${{ matrix.os }}-${{ matrix.shard }}
          path: .local-docs/test-results.json
          include-hidden-files: true
          if-no-files-found: error
  installed-package:
    needs: scope
    if: needs.scope.outputs.package == 'true'
    name: Installed package / ${{ matrix.os }} / ${{ matrix.shard }} of ${{ matrix.total }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, shard: 1, total: 1 }
          - { os: windows-latest, shard: 1, total: 3 }
          - { os: windows-latest, shard: 2, total: 3 }
          - { os: windows-latest, shard: 3, total: 3 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Use the pinned package manager
        run: npm install --global npm@11.20.0 --ignore-scripts
      - name: Install the locked dependencies
        run: npm ci
      - name: Verify installed package consumers
        run: npm run test:package -- --shard=${{ matrix.shard }}/${{ matrix.total }} --reporter=default --reporter=json --outputFile=.local-docs/test-results.json
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        if: always()
        with:
          name: installed-${{ matrix.os }}-${{ matrix.shard }}
          path: .local-docs/test-results.json
          include-hidden-files: true
          if-no-files-found: error
  java:
    needs: scope
    if: needs.scope.outputs.java == 'true'
    name: Java 21 ${{ matrix.suite }} / ${{ matrix.os }}${{ matrix.suite == 'acceptance' && format(' / {0} of {1}', matrix.shard, matrix.total) || '' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, suite: unit }
          - { os: windows-latest, suite: unit }
          - { os: ubuntu-latest, suite: package }
          - { os: windows-latest, suite: package }
          - { os: ubuntu-latest, suite: acceptance, shard: 1, total: 3 }
          - { os: ubuntu-latest, suite: acceptance, shard: 2, total: 3 }
          - { os: ubuntu-latest, suite: acceptance, shard: 3, total: 3 }
          - { os: windows-latest, suite: acceptance, shard: 1, total: 5 }
          - { os: windows-latest, suite: acceptance, shard: 2, total: 5 }
          - { os: windows-latest, suite: acceptance, shard: 3, total: 5 }
          - { os: windows-latest, suite: acceptance, shard: 4, total: 5 }
          - { os: windows-latest, suite: acceptance, shard: 5, total: 5 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Use the pinned package manager
        run: npm install --global npm@11.20.0 --ignore-scripts
      - name: Install the locked dependencies
        run: npm ci
      - name: Acquire the exact native test console
        shell: pwsh
        run: |
          $jdk = node --input-type=module -e 'import { cpSync, realpathSync, mkdtempSync } from "node:fs"; import { join } from "node:path"; const target=mkdtempSync(join(realpathSync(process.env.RUNNER_TEMP),"expec-java-jdk-")); cpSync(realpathSync(process.env.JAVA_HOME),target,{recursive:true,dereference:true}); console.log(target);'
          if ($LASTEXITCODE -ne 0) { throw 'Could not prepare an ordinary native JDK fixture.' }
          $jar = Join-Path $env:RUNNER_TEMP 'junit-platform-console-standalone-6.1.3.jar'
          Invoke-WebRequest 'https://repo.maven.apache.org/maven2/org/junit/platform/junit-platform-console-standalone/6.1.3/junit-platform-console-standalone-6.1.3.jar' -OutFile $jar
          if ((Get-FileHash -LiteralPath $jar -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'e62b96ac475dbcde8599ea905d088f65d90778f86e259b856a49fa5c4ea256ec') { throw 'JUnit console checksum mismatch.' }
          "EXPEC_TEST_JUNIT_CONSOLE=$jar" >> $env:GITHUB_ENV
          "JAVA_HOME=$jdk" >> $env:GITHUB_ENV
          "EXPEC_TEST_JAVA_HOME=$jdk" >> $env:GITHUB_ENV
      - name: Build native and public package resources
        if: matrix.suite != 'package'
        run: npm run build
      - name: Check Java native behavior
        if: matrix.suite != 'package'
        run: npm run test:java -- test/${{ matrix.suite }} ${{ matrix.suite == 'acceptance' && format('--shard={0}/{1}', matrix.shard, matrix.total) || '' }} --reporter=default --reporter=json --outputFile=.local-docs/test-results.json
      - name: Check the actual installed Java consumer
        if: matrix.suite == 'package'
        run: npm run test:java-package -- --reporter=default --reporter=json --outputFile=.local-docs/test-results.json
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        if: always()
        with:
          name: java-${{ matrix.suite }}-${{ matrix.os }}${{ matrix.suite == 'acceptance' && format('-{0}-of-{1}', matrix.shard, matrix.total) || '' }}
          path: .local-docs/test-results.json
          include-hidden-files: true
          if-no-files-found: error

  kotlin:
    needs: scope
    if: needs.scope.outputs.kotlin == 'true'
    name: Kotlin native / ${{ matrix.os }} / ${{ matrix.shard == 'package' && 'installed package' || format('shard {0} of {1}', matrix.shard, matrix.total) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, shard: 1, total: 4 }
          - { os: ubuntu-latest, shard: 2, total: 4 }
          - { os: ubuntu-latest, shard: 3, total: 4 }
          - { os: ubuntu-latest, shard: 4, total: 4 }
          - { os: ubuntu-latest, shard: package, total: 4 }
          - { os: windows-latest, shard: 1, total: 6 }
          - { os: windows-latest, shard: 2, total: 6 }
          - { os: windows-latest, shard: 3, total: 6 }
          - { os: windows-latest, shard: 4, total: 6 }
          - { os: windows-latest, shard: 5, total: 6 }
          - { os: windows-latest, shard: 6, total: 6 }
          - { os: windows-latest, shard: package, total: 6 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: Use the pinned package manager
        run: npm install --global npm@11.20.0 --ignore-scripts
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Materialize an ordinary native test toolchain
        run: node --input-type=module -e "import { appendFile, cp, mkdtemp, realpath } from 'node:fs/promises'; import { join } from 'node:path'; const home = await mkdtemp(join(await realpath(process.env.RUNNER_TEMP), 'expec-jdk-')); await cp(await realpath(process.env.JAVA_HOME), home, { recursive:true, dereference:true }); await appendFile(process.env.GITHUB_ENV, 'EXPEC_TEST_JAVA_HOME=' + home + '\n');"
      - name: Supply the verified native JUnit test input
        shell: pwsh
        run: |
          $junit = Join-Path $env:RUNNER_TEMP 'junit-platform-console-standalone-6.1.3.jar'
          Invoke-WebRequest 'https://repo.maven.apache.org/maven2/org/junit/platform/junit-platform-console-standalone/6.1.3/junit-platform-console-standalone-6.1.3.jar' -OutFile $junit
          if ((Get-FileHash -LiteralPath $junit -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'e62b96ac475dbcde8599ea905d088f65d90778f86e259b856a49fa5c4ea256ec') { throw 'JUnit artifact checksum mismatch' }
          "EXPEC_TEST_JUNIT_CONSOLE=$junit" >> $env:GITHUB_ENV
      - name: Install the locked dependencies
        run: npm ci
      - name: Build the actual native bridge and public package
        if: matrix.shard != 'package'
        run: npm run build
      - name: Run every selected native unit and acceptance test
        if: matrix.shard != 'package'
        run: npm run test:kotlin -- --shard=${{ matrix.shard }}/${{ matrix.total }} --reporter=default --reporter=json --outputFile=.local-docs/test-results.json
      - name: Verify the installed Kotlin consumer
        if: matrix.shard == 'package'
        run: npm run test:kotlin-package -- --reporter=default --reporter=json --outputFile=.local-docs/test-results.json
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        if: always()
        with:
          name: kotlin-${{ matrix.os }}-${{ matrix.shard == 'package' && 'package' || format('{0}-of-{1}', matrix.shard, matrix.total) }}
          path: .local-docs/test-results.json
          include-hidden-files: true
          if-no-files-found: error
