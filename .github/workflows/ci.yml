name: Build and test

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    inputs:
      ref:
        type: string
        required: false
        default: ''

permissions:
  contents: read

jobs:
  check:
    name: Node 24 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: Use the pinned package manager
        run: npm install --global npm@11.20.0 --ignore-scripts
      - name: Install the locked dependencies
        run: npm ci
      - name: Regenerate, typecheck, test, and build
        run: npm run grammar:generate && npm run typecheck && npx vitest run --config vitest.core.config.ts && npm run build
  python:
    name: Python 3.12 / ${{ matrix.os }} / ${{ matrix.shard }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        shard: [1, 2, 3, 4]
        include:
          - os: ubuntu-latest
            python: '3.12.14'
          - os: windows-latest
            python: '3.12.10'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install the finite Python test profile
        shell: pwsh
        run: |
          $tools = Join-Path $env:RUNNER_TEMP 'expec-python-tools'
          python -m venv --copies $tools
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $native = Join-Path $tools $(if ($IsWindows) { 'Scripts/python.exe' } else { 'bin/python' })
          & $native -m pip install --only-binary=:all: uv==0.12.23 libcst==1.9.0 jedi==0.20.0 mypy==2.4.0 pytest==9.1.1
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $interpreter = python -I -S -c 'import pathlib,sys; print(pathlib.Path(sys.executable).resolve())'
          $sites = & $native -I -c 'import sysconfig; print(sysconfig.get_path("purelib"))'
          $uv = Join-Path $tools $(if ($IsWindows) { 'Scripts/uv.exe' } else { 'bin/uv' })
          "EXPEC_TEST_PYTHON=$interpreter" >> $env:GITHUB_ENV
          "EXPEC_TEST_PYTHON_SITE=$sites" >> $env:GITHUB_ENV
          "EXPEC_TEST_UV=$uv" >> $env:GITHUB_ENV
      - name: Install the locked JavaScript dependencies
        run: npm install --global npm@11.20.0 --ignore-scripts && npm ci
      - name: Regenerate and check native Python consumers
        run: npm run grammar:generate && npx vitest run --config vitest.python.config.ts --shard=${{ matrix.shard }}/4
  installed-package:
    name: Installed package / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: Use the pinned package manager
        run: npm install --global npm@11.20.0 --ignore-scripts
      - name: Install the locked dependencies
        run: npm ci
      - name: Verify installed package consumers
        run: npm run test:package
