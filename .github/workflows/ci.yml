name: Build and test

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    inputs:
      ref:
        type: string
        required: false
        default: ''

permissions:
  contents: read

jobs:
  check:
    name: Node 24 / ${{ matrix.os }} / ${{ matrix.shard }} of 4
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: Use the pinned package manager
        run: npm install --global npm@11.20.0 --ignore-scripts
      - name: Install the locked dependencies
        run: npm ci
      - name: Regenerate the grammar
        run: npm run grammar:generate
      - name: Check all source and test types
        run: npm run typecheck
      - name: Build and test the shard
        run: npm test -- --shard=${{ matrix.shard }}/4 --maxWorkers=2 --reporter=default --reporter=json --outputFile=.local-docs/test-results.json
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        if: always()
        with:
          name: core-${{ matrix.os }}-${{ matrix.shard }}
          path: .local-docs/test-results.json
          include-hidden-files: true
          if-no-files-found: error
  project-pilot:
    name: Project pilot / ${{ matrix.os }} / ${{ matrix.shard }} of 4
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: Use the pinned package manager
        run: npm install --global npm@11.20.0 --ignore-scripts
      - name: Install the locked dependencies
        run: npm ci
      - name: Verify installed project journeys
        run: npm run test:pilot -- --shard=${{ matrix.shard }}/4 --reporter=default --reporter=json --outputFile=.local-docs/test-results.json
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        if: always()
        with:
          name: pilot-${{ matrix.os }}-${{ matrix.shard }}
          path: .local-docs/test-results.json
          include-hidden-files: true
          if-no-files-found: error
  installed-package:
    name: Installed package / ${{ matrix.os }} / ${{ matrix.shard }} of 2
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        shard: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: Use the pinned package manager
        run: npm install --global npm@11.20.0 --ignore-scripts
      - name: Install the locked dependencies
        run: npm ci
      - name: Verify installed package consumers
        run: npm run test:package -- --shard=${{ matrix.shard }}/2 --reporter=default --reporter=json --outputFile=.local-docs/test-results.json
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        if: always()
        with:
          name: installed-${{ matrix.os }}-${{ matrix.shard }}
          path: .local-docs/test-results.json
          include-hidden-files: true
          if-no-files-found: error
