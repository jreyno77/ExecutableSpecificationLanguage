name: Build and test

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    inputs:
      ref:
        type: string
        required: false
        default: ''

permissions:
  contents: read

jobs:
  check:
    name: Node 24 / ${{ matrix.os }} / ${{ matrix.shard }} of 5
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        shard: [1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Use the pinned package manager
        run: npm install --global npm@11.20.0 --ignore-scripts
      - name: Install the locked dependencies
        run: npm ci
      - name: Regenerate the grammar
        run: npm run grammar:generate
      - name: Build the native Java resources
        run: npm run java:build
      - name: Check all source and test types
        run: npm run typecheck
      - name: Build and test the shard
        run: npm test -- --config vitest.core.config.ts --shard=${{ matrix.shard }}/5 --maxWorkers=2 --reporter=default --reporter=json --outputFile=.local-docs/test-results.json
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        if: always()
        with:
          name: core-${{ matrix.os }}-${{ matrix.shard }}
          path: .local-docs/test-results.json
          include-hidden-files: true
          if-no-files-found: error
  project-pilot:
    name: Project pilot / ${{ matrix.os }} / ${{ matrix.shard }} of ${{ matrix.total }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, shard: 1, total: 2 }
          - { os: ubuntu-latest, shard: 2, total: 2 }
          - { os: windows-latest, shard: 1, total: 4 }
          - { os: windows-latest, shard: 2, total: 4 }
          - { os: windows-latest, shard: 3, total: 4 }
          - { os: windows-latest, shard: 4, total: 4 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Use the pinned package manager
        run: npm install --global npm@11.20.0 --ignore-scripts
      - name: Install the locked dependencies
        run: npm ci
      - name: Verify installed project journeys
        env:
          EXPEC_CLEANUP_TIMINGS: '1'
        run: npm run test:pilot -- --shard=${{ matrix.shard }}/${{ matrix.total }} --reporter=default --reporter=json --outputFile=.local-docs/test-results.json
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        if: always()
        with:
          name: pilot-${{ matrix.os }}-${{ matrix.shard }}
          path: .local-docs/test-results.json
          include-hidden-files: true
          if-no-files-found: error
  installed-package:
    name: Installed package / ${{ matrix.os }} / ${{ matrix.shard }} of ${{ matrix.total }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, shard: 1, total: 1 }
          - { os: windows-latest, shard: 1, total: 3 }
          - { os: windows-latest, shard: 2, total: 3 }
          - { os: windows-latest, shard: 3, total: 3 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Use the pinned package manager
        run: npm install --global npm@11.20.0 --ignore-scripts
      - name: Install the locked dependencies
        run: npm ci
      - name: Verify installed package consumers
        run: npm run test:package -- --shard=${{ matrix.shard }}/${{ matrix.total }} --reporter=default --reporter=json --outputFile=.local-docs/test-results.json
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        if: always()
        with:
          name: installed-${{ matrix.os }}-${{ matrix.shard }}
          path: .local-docs/test-results.json
          include-hidden-files: true
          if-no-files-found: error
  java:
    name: Java 21 ${{ matrix.suite }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        suite: [unit, acceptance, package]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Use the pinned package manager
        run: npm install --global npm@11.20.0 --ignore-scripts
      - name: Install the locked dependencies
        run: npm ci
      - name: Acquire the exact native test console
        shell: pwsh
        run: |
          $jdk = node --input-type=module -e 'import { cpSync, realpathSync, mkdtempSync } from "node:fs"; import { join } from "node:path"; const target=mkdtempSync(join(realpathSync(process.env.RUNNER_TEMP),"expec-java-jdk-")); cpSync(realpathSync(process.env.JAVA_HOME),target,{recursive:true,dereference:true}); console.log(target);'
          if ($LASTEXITCODE -ne 0) { throw 'Could not prepare an ordinary native JDK fixture.' }
          $jar = Join-Path $env:RUNNER_TEMP 'junit-platform-console-standalone-6.1.3.jar'
          Invoke-WebRequest 'https://repo.maven.apache.org/maven2/org/junit/platform/junit-platform-console-standalone/6.1.3/junit-platform-console-standalone-6.1.3.jar' -OutFile $jar
          if ((Get-FileHash -LiteralPath $jar -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'e62b96ac475dbcde8599ea905d088f65d90778f86e259b856a49fa5c4ea256ec') { throw 'JUnit console checksum mismatch.' }
          "EXPEC_TEST_JUNIT_CONSOLE=$jar" >> $env:GITHUB_ENV
          "JAVA_HOME=$jdk" >> $env:GITHUB_ENV
          "EXPEC_TEST_JAVA_HOME=$jdk" >> $env:GITHUB_ENV
      - name: Build native and public package resources
        if: matrix.suite != 'package'
        run: npm run build
      - name: Check Java native behavior
        if: matrix.suite != 'package'
        run: npm run test:java -- test/${{ matrix.suite }} --reporter=default --reporter=json --outputFile=.local-docs/test-results.json
      - name: Check the actual installed Java consumer
        if: matrix.suite == 'package'
        run: npm run test:java-package -- --reporter=default --reporter=json --outputFile=.local-docs/test-results.json
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        if: always()
        with:
          name: java-${{ matrix.suite }}-${{ matrix.os }}
          path: .local-docs/test-results.json
          include-hidden-files: true
          if-no-files-found: error
