name: Deliver merged pull request

on:
  pull_request:
    types: [closed]

permissions:
  contents: write
  pull-requests: read
  deployments: write

concurrency:
  group: delivery-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  deliver:
    if: github.event.pull_request.merged == true && github.event.pull_request.base.ref == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the exact merged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          package-manager-cache: false
      - name: Use the pinned package manager
        run: npm install --global npm@11.20.0 --ignore-scripts
      - name: Build, verify, and deliver the immutable artifact
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { deliverMergedPullRequest } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/release/deliver.mjs`);
            await deliverMergedPullRequest({ github, context, core });
