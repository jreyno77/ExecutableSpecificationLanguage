plugins { id 'java' }
repositories { mavenCentral() }
java { toolchain { languageVersion = JavaLanguageVersion.of(21) } }
dependencies {
    implementation 'org.eclipse.jdt:org.eclipse.jdt.core:3.47.0'
    implementation 'org.eclipse.platform:org.eclipse.text:3.14.800'
}
dependencyLocking { lockAllConfigurations() }
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
tasks.named('jar') { archiveFileName = 'expec-java-bridge.jar' }
tasks.register('stageNative', Sync) {
    dependsOn tasks.named('jar')
    from configurations.runtimeClasspath
    from tasks.named('jar')
    from 'NOTICE.md'
    from 'acquire.gradle'
    into('wrapper') { from 'gradlew', 'gradlew.bat'; into('gradle/wrapper') { from 'gradle/wrapper' } }
    into '../java'
    doLast {
        def artifacts = destinationDir.listFiles().findAll { it.name.endsWith('.jar') }.sort { it.name }.collect { file ->
            [file: file.name, version: java.security.MessageDigest.getInstance('SHA-256').digest(file.bytes).encodeHex().toString()]
        }
        new File(destinationDir, 'artifacts.json').text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson([format: 1, artifacts: artifacts])) + '\n'
        configurations.runtimeClasspath.resolvedConfiguration.resolvedArtifacts.each { artifact ->
            copy {
                from zipTree(artifact.file)
                include 'about.html', 'about_files/**', 'META-INF/LICENSE*', 'META-INF/NOTICE*'
                into new File(destinationDir, 'notices/' + artifact.file.name)
            }
        }
    }
}
tasks.named('wrapper') {
    gradleVersion = '9.1.0'
    distributionSha256Sum = 'a17ddd85a26b6a7f5ddb71ff8b05fc5104c0202c6e64782429790c933686c806'
}
